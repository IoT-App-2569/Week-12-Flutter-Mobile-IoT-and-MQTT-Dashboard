# Mosquitto MQTT Broker Configuration
# รองรับทั้ง Native TCP Socket (1883) สำหรับ macOS Desktop / Android / ESP32
# และ WebSocket (9001) สำหรับ Flutter Web (Chrome)

# 1. Native TCP Listener สำหรับ Desktop, อุปกรณ์มือถือ และฮาร์ดแวร์ ESP32
listener 1883 0.0.0.0
allow_anonymous true

# 2. WebSocket Listener สำหรับ Flutter Web บน Google Chrome
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true
