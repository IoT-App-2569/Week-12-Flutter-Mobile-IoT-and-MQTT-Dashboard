# Mosquitto MQTT Broker Configuration
# อนุญาตให้เชื่อมต่อจากทุก Network Interface (รวมถึง IP วง LAN และ Loopback)
listener 1883 0.0.0.0

# WebSocket สำหรับ Flutter ที่รันบน Chrome (MqttBrowserClient)
listener 9001 0.0.0.0
protocol websockets

# อนุญาตให้เชื่อมต่อโดยไม่ต้องใช้ Username/Password ในสภาพแวดล้อมห้องทดลอง
allow_anonymous true
